name: Deploy MEEi message push function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-supabase-push.yml'
      - 'supabase/functions/send-message-push/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MEEI_PUSH_WEBHOOK_SECRET: ${{ secrets.MEEI_PUSH_WEBHOOK_SECRET || secrets.CUCKOO_PUSH_WEBHOOK_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$MEEI_PUSH_WEBHOOK_SECRET" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN and MEEI_PUSH_WEBHOOK_SECRET in GitHub Actions secrets."
            exit 1
          fi
          npx --yes supabase@latest secrets set "MEEI_PUSH_WEBHOOK_SECRET=$MEEI_PUSH_WEBHOOK_SECRET" --project-ref sbzqxacibcfyyxoysseu --yes
          npx --yes supabase@latest functions deploy send-message-push --project-ref sbzqxacibcfyyxoysseu --yes
