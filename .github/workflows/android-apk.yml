name: Build MeetApp Standalone Preview APK

on:
  push:
    branches:
      - test/profile-load-save
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meei-standalone-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Validate standalone preview profile
        run: |
          node -e "const p=require('./eas.json').build.preview; if (p.developmentClient || p.android?.buildType !== 'apk') process.exit(1); console.log('Standalone APK profile confirmed (developmentClient is not enabled).')"

      - name: Build standalone Android APK on EAS
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download completed APK
        run: |
          mkdir -p artifacts
          eas build:download --platform android --latest --path artifacts/meei-standalone-preview.apk
          test -s artifacts/meei-standalone-preview.apk
          file artifacts/meei-standalone-preview.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: meei-standalone-preview
          path: artifacts/meei-standalone-preview.apk
          if-no-files-found: error
          retention-days: 7
