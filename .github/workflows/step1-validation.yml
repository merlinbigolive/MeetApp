name: Step 1 validation

on:
  push:
    branches:
      - fix/step1-meei-app-branding
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-export:
    name: TypeScript and Expo exports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Generate temporary dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit dependencies
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))"

      - name: Expo Doctor
        run: npx expo-doctor

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Diagnose Expo SDK dependency versions
        run: |
          npm ls expo expo-asset expo-modules-core expo-audio --all || true
          npx expo install --check

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir dist/android

      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir dist/ios
